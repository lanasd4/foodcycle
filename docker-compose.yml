# Local development services for FoodCycle.
# Usage:  docker compose up -d      (from the repository root)
name: foodcycle

services:
  db:
    image: postgis/postgis:16-3.4
    restart: unless-stopped
    environment:
      POSTGRES_USER: foodcycle
      POSTGRES_PASSWORD: foodcycle_dev
      POSTGRES_DB: foodcycle
    ports:
      - "5433:5432"   # 5433 on the host: a native PostgreSQL 16 already uses 5432
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./infra/db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U foodcycle -d foodcycle"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data

volumes:
  db-data:
  redis-data:
